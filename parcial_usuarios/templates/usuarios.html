```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de usuarios</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h1 {
            text-align: center;
            color: #243447;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #243447;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        .boton {
            display: inline-block;
            padding: 8px 12px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 2px;
        }

        .eliminar {
            background-color: #dc2626;
        }

        .vacio {
            text-align: center;
            color: #666666;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>Lista de usuarios</h1>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for u in usuarios %}
                <tr>
                    <td>{{ u.idUsuario }}</td>
                    <td>{{ u.usuario }}</td>
                    <td>{{ u.nombre }}</td>
                    <td>{{ u.direccion }}</td>
                    <td>{{ u.telefono }}</td>
                    <td>
                        <a class="boton"
                           href="{{ url_for('modificar', idusuario=u.idUsuario) }}">
                            Modificar
                        </a>

                        <a class="boton eliminar"
                           href="{{ url_for('eliminar', idusuario=u.idUsuario) }}"
                           onclick="return confirm('¿Deseas eliminar este usuario?');">
                            Eliminar
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" class="vacio">
                        No hay usuarios registrados.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
```
